[package]
name = "paperflow"
version = "1.0.0"
description = "PaperFlow - Local PDF Exam Learning Tool"
authors = ["PaperFlow"]
edition = "2021"

[lib]
name = "paperflow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[package.metadata]
# Tauri bundler metadata

[package.metadata.tauri-winres]
FileDescription = "PaperFlow"
