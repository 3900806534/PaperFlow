<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><title>PaperFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:48px;height:48px;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:"Microsoft YaHei",sans-serif}
#ball{
  position:absolute;left:2px;top:2px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,0.18),transparent 42%),linear-gradient(145deg,#32206b,#160a30);
  border:1.5px solid rgba(201,168,76,0.6);
  box-shadow:0 3px 12px rgba(8,3,20,0.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
}
#ball:hover{box-shadow:0 3px 16px rgba(201,168,76,0.5)}
#star{font-size:20px;color:#c9a84c;line-height:1}
#txt{font-size:7px;color:#c9a84c;margin-top:2px;white-space:nowrap}
</style>
</head>
<body>
<div id="ball">
  <span id="star">&#9737;</span>
  <span id="txt">PaperFlow</span>
</div>
<script type="module">
import { getCurrentWindow } from "@tauri-apps/api/window";
import { emit } from "@tauri-apps/api/event";

const win = getCurrentWindow();
const ball = document.getElementById("ball");
let d = false, sx = 0, sy = 0, px = 0, py = 0;

ball.addEventListener("pointerdown", async e => {
  e.preventDefault(); e.stopPropagation();
  const p = await win.outerPosition();
  px = p.x; py = p.y;
  sx = e.clientX; sy = e.clientY;
  d = false;
  ball.setPointerCapture(e.pointerId);
});

ball.addEventListener("pointermove", async e => {
  if (!ball.hasPointerCapture(e.pointerId)) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) d = true;
  if (d) {
    await win.setPosition({ x: Math.round(px + dx), y: Math.round(py + dy) });
  }
});

ball.addEventListener("pointerup", async e => {
  ball.releasePointerCapture(e.pointerId);
  if (!d) {
    await emit("floatball-click");
  }
});

// Right click: open main window
ball.addEventListener("contextmenu", async e => {
  e.preventDefault();
  await emit("floatball-click");
});

win.setAlwaysOnTop(true).catch(()=>{});
</script>
</body></html>
