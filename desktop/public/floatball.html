<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><title>PaperFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:"Microsoft YaHei",sans-serif}
#ball{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,0.18),transparent 42%),linear-gradient(145deg,#32206b,#160a30);
  border:1.5px solid rgba(201,168,76,0.6);
  box-shadow:0 3px 12px rgba(8,3,20,0.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
}
#ball:hover{box-shadow:0 3px 16px rgba(201,168,76,0.5)}
#star{font-size:20px;color:#c9a84c;line-height:1;pointer-events:none}
#txt{font-size:7px;color:#c9a84c;margin-top:2px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="ball"><span id="star">&#9737;</span><span id="txt">PaperFlow</span></div>
<script type="module">
import { getCurrentWindow } from "@tauri-apps/api/window";
import { emit } from "@tauri-apps/api/event";

const win = getCurrentWindow();
let startX = 0, startY = 0, winX = 0, winY = 0, dragging = false;

document.addEventListener("pointerdown", async (e) => {
  if (e.button !== 0) return;
  const pos = await win.outerPosition();
  winX = pos.x; winY = pos.y;
  startX = e.screenX; startY = e.screenY;
  dragging = true;
  e.preventDefault();
});

document.addEventListener("pointermove", async (e) => {
  if (!dragging) return;
  const dx = e.screenX - startX, dy = e.screenY - startY;
  if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
    await win.setPosition({ x: Math.round(winX + dx), y: Math.round(winY + dy) });
  }
});

document.addEventListener("pointerup", async (e) => {
  if (!dragging) return;
  dragging = false;
  const dx = e.screenX - startX, dy = e.screenY - startY;
  if (Math.abs(dx) <= 2 && Math.abs(dy) <= 2) {
    await emit("floatball-click");
  }
});

document.addEventListener("contextmenu", async (e) => {
  e.preventDefault();
  await emit("floatball-click");
});

win.setAlwaysOnTop(true).catch(()=>{});
</script>
</body></html>
